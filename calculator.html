<body>

<!-- CALCULATOR -->

<div class="calculator">

    <div class="display" id="display">0</div>

    <div class="buttons">

        <button class="calc-btn clear" onclick="clearDisplay()">AC</button>
        <button class="calc-btn clear" onclick="deleteLast()">⌫</button>
        <button class="calc-btn operator" onclick="addOperator('%')">%</button>
        <button class="calc-btn operator" onclick="addOperator('/')">÷</button>

        <button class="calc-btn number" onclick="addNumber('7')">7</button>
        <button class="calc-btn number" onclick="addNumber('8')">8</button>

        <button class="calc-btn number" onclick="addNumber('5')">5</button>
        <button class="calc-btn number" onclick="addNumber('6')">6</button>
        <button class="calc-btn operator" onclick="addOperator('-')">−</button>

        <button class="calc-btn number" onclick="addNumber('1')">1</button>

        <button class="calc-btn number" onclick="addNumber('3')">3</button>

</div>


<!-- GAME CENTER -->

    <!-- GAME CARDS -->

    <div class="games" id="gamesList">

<script>

/* =========================
   CALCULATOR
========================= */

let current = "";
const display = document.getElementById("display");

function addNumber(number) {

    current += number;
    display.textContent = current;

    checkSecret();
}

function addOperator(operator) {

    current += operator;
    display.textContent = current;

    checkSecret();
}

function clearDisplay() {

    current = "";
    display.textContent = "0";
}

function deleteLast() {

    current = current.slice(0, -1);

    display.textContent = current || "0";
}

function calculate() {

    try {

        if (!current) return;

        const result = Function(
            '"use strict"; return (' + current + ')'
        )();

        display.textContent = result;
        current = String(result);

    } catch {

        display.textContent = "Error";
        current = "";

    }

    checkSecret();
}


/* =========================
   SECRET CODE
========================= */

const secretParts = [735, 5608];
const secretCode = secretParts.join("");

function checkSecret() {

    if (current === secretCode) {

        document.getElementById("gameCenter").style.display = "block";

        current = "";
        display.textContent = "0";

    }
}


/* =========================
   GAME CENTER
========================= */

function closeGameCenter() {

    document.getElementById("gameCenter").style.display = "none";

    backToGames();
}

function startGame(game) {

    document.getElementById("gamesList").style.display = "none";
    document.querySelector(".controls").style.display = "none";

    if (game === "2048") {

        document.getElementById("game2048").classList.add("active");
        new2048Game();

    }

    if (game === "reaction") {

        document.getElementById("reactionGame").classList.add("active");

        resetReaction();

    }
}

function backToGames() {

    document.querySelectorAll(".game-screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById("gamesList").style.display = "grid";
    document.querySelector(".controls").style.display = "flex";
}


/* =========================
   SEARCH
========================= */

function filterGames() {

    const search =
        document.getElementById("search").value.toLowerCase();

    const category =
        document.getElementById("category").value;

    document.querySelectorAll(".game-card").forEach(card => {

        const name = card.dataset.name;
        const cardCategory = card.dataset.category;

        const matchesSearch = name.includes(search);

        const matchesCategory =
            category === "all" ||
            cardCategory === category;

        card.style.display =
            matchesSearch && matchesCategory
            ? "block"
            : "none";
    });
}


/* =========================
   FAVORITES
========================= */

let favorites =
    JSON.parse(localStorage.getItem("gameFavorites") || "[]");

function toggleFavorite(button, game) {

    if (favorites.includes(game)) {

        favorites =
            favorites.filter(item => item !== game);

        button.textContent = "☆";

    } else {

        favorites.push(game);
        button.textContent = "★";

    }

    localStorage.setItem(
        "gameFavorites",
        JSON.stringify(favorites)
    );
}

function loadFavorites() {

    document.querySelectorAll(".favorite").forEach(button => {

        const onclick = button.getAttribute("onclick");

        favorites.forEach(game => {

            if (onclick.includes("'" + game + "'")) {
                button.textContent = "★";
            }

        });

    });
}

loadFavorites();


/* =========================
   2048
========================= */

let grid = [];
let score = 0;

function new2048Game() {

    grid = Array.from(
        { length: 4 },
        () => Array(4).fill(0)
    );

    score = 0;

    addRandomTile();
    addRandomTile();

    render2048();
}

function addRandomTile() {

    const empty = [];

    for (let r = 0; r < 4; r++) {

        for (let c = 0; c < 4; c++) {

            if (grid[r][c] === 0) {
                empty.push([r, c]);
            }

        }
    }

    if (!empty.length) return;

    const [r, c] =
        empty[Math.floor(Math.random() * empty.length)];

    grid[r][c] =
        Math.random() < .9 ? 2 : 4;
}

function render2048() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    grid.forEach(row => {

        row.forEach(value => {

            const tile =
                document.createElement("div");

            tile.className = "tile";

            if (value) {
                tile.classList.add("tile-" + value);
                tile.textContent = value;
            }

            board.appendChild(tile);

        });

    });

    document.getElementById("score").textContent = score;
}

function compress(row) {

    return row.filter(value => value !== 0);
}

function merge(row) {

    for (let i = 0; i < row.length - 1; i++) {

        if (row[i] === row[i + 1]) {

            row[i] *= 2;
            score += row[i];

            row.splice(i + 1, 1);
        }

    }

    return row;
}

function move2048(direction) {

    let old =
        JSON.stringify(grid);

    if (direction === "left") {

        for (let r = 0; r < 4; r++) {

            let row = compress(grid[r]);
            row = merge(row);

            while (row.length < 4) row.push(0);

            grid[r] = row;
        }
    }

    if (direction === "right") {

        for (let r = 0; r < 4; r++) {

            let row =
                compress(grid[r].slice().reverse());

            row = merge(row);

            while (row.length < 4) row.push(0);

            grid[r] = row.reverse();
        }
    }

    if (direction === "up") {

        for (let c = 0; c < 4; c++) {

            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(grid[r][c]);
            }

            column = compress(column);
            column = merge(column);

            while (column.length < 4) column.push(0);

            for (let r = 0; r < 4; r++) {
                grid[r][c] = column[r];
            }
        }
    }

    if (direction === "down") {

        for (let c = 0; c < 4; c++) {

            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(grid[r][c]);
            }

            column =
                compress(column.reverse());

            column = merge(column);

            while (column.length < 4) column.push(0);

            column.reverse();

            for (let r = 0; r < 4; r++) {
                grid[r][c] = column[r];
            }
        }
    }

    if (JSON.stringify(grid) !== old) {

        addRandomTile();
        render2048();

        if (isGameOver()) {

            setTimeout(() => {
                alert("Game Over!");
            }, 100);

        }
    }
}

function isGameOver() {

    for (let r = 0; r < 4; r++) {

        for (let c = 0; c < 4; c++) {

            if (grid[r][c] === 0)
                return false;

            if (
                c < 3 &&
                grid[r][c] === grid[r][c + 1]
            )
                return false;

            if (
                r < 3 &&
                grid[r][c] === grid[r + 1][c]
            )
                return false;
        }
    }

    return true;
}


/* KEYBOARD */

document.addEventListener("keydown", event => {

    if (
        document.getElementById("game2048")
        .classList.contains("active")
    ) {

        if (event.key === "ArrowLeft") {
            event.preventDefault();
            move2048("left");
        }

        if (event.key === "ArrowRight") {
            event.preventDefault();
            move2048("right");
        }

        if (event.key === "ArrowUp") {
            event.preventDefault();
            move2048("up");
        }

        if (event.key === "ArrowDown") {
            event.preventDefault();
            move2048("down");
        }
    }

});


/* SWIPE */

let touchStartX = 0;
let touchStartY = 0;

const board = document.getElementById("board");

board.addEventListener("touchstart", event => {

    touchStartX = event.changedTouches[0].screenX;
    touchStartY = event.changedTouches[0].screenY;

}, { passive: true });

board.addEventListener("touchend", event => {

    const endX =
        event.changedTouches[0].screenX;

    const endY =
        event.changedTouches[0].screenY;

    const dx = endX - touchStartX;
    const dy = endY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30)
        return;

    if (Math.abs(dx) > Math.abs(dy)) {

        move2048(dx > 0 ? "right" : "left");

    } else {

        move2048(dy > 0 ? "down" : "up");

    }

});


/* =========================
   REACTION TEST
========================= */

let reactionState = "idle";
let reactionStart = 0;
let reactionTimer = null;

function resetReaction() {

    reactionState = "idle";

    const box =
        document.getElementById("reactionBox");

    box.className = "reaction-box";

    document.getElementById("reactionText").textContent =
        "Press START to begin";

    const best =
        localStorage.getItem("reactionBest");

    document.getElementById("reactionResult").textContent =
        best ? "Best: " + best + " ms" : "Best: —";
}

function startReaction() {

    clearTimeout(reactionTimer);

    const box =
        document.getElementById("reactionBox");

    const text =
        document.getElementById("reactionText");

    reactionState = "waiting";

    box.className = "reaction-box waiting";

    text.textContent =
        "Wait for green...";

    const delay =
        1500 + Math.random() * 3500;

    reactionTimer = setTimeout(() => {

        reactionState = "ready";

        reactionStart = performance.now();

        box.className = "reaction-box ready";

        text.textContent =
            "CLICK NOW!";

    }, delay);
}

function reactionClick() {

    if (reactionState === "waiting") {

        clearTimeout(reactionTimer);

        reactionState = "idle";

        document.getElementById("reactionBox").className =
            "reaction-box";

        document.getElementById("reactionText").textContent =
            "Too early! Press START.";

        return;
    }

    if (reactionState === "ready") {

        const time =
            Math.round(performance.now() - reactionStart);

        reactionState = "idle";

        document.getElementById("reactionBox").className =
            "reaction-box";

        document.getElementById("reactionText").textContent =
            time + " ms";

        let best =
            Number(localStorage.getItem("reactionBest") || 99999);

        if (time < best) {

            best = time;

            localStorage.setItem(
                "reactionBest",
                String(best)
            );

            document.getElementById("reactionResult").textContent =
                "NEW BEST: " + best + " ms";

        } else {

            document.getElementById("reactionResult").textContent =
                "Best: " + best + " ms";
        }
    }
}

</script>

</body>
</html>
